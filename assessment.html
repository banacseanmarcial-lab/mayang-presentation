<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment | MindCare AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg"></div>

  <div id="loader">
    <div class="loader-text">🧠 MindCare AI</div>
  </div>

  <div class="ai-orb" onclick="window.location.href='ai-chat.html'" title="Open AI Chat"></div>

  <nav class="navbar">
    <div class="logo">🧠 MindCare AI</div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="emotion-feed.html">Emotion Feed</a></li>
      <li><a href="ai-chat.html">AI Chat</a></li>
      <li><a href="journal.html">Journal</a></li>
      <li><a href="assessment.html">Assessment</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li>
        <button onclick="toggleDarkMode()" style="padding:8px 16px; font-size:0.85rem;">
          🌙 Dark Mode
        </button>
      </li>
    </ul>
  </nav>

  <main>
    <div class="form-container glass">

      <h2>📊 Wellness Assessment</h2>
      <p style="color:var(--subtext); margin-bottom:24px;">
        Answer honestly. This helps gauge your current emotional state.
      </p>

      <label>1. How often have you felt overwhelmed this week?</label>
      <select id="q1">
        <option value="0">Never</option>
        <option value="1">Rarely</option>
        <option value="2">Sometimes</option>
        <option value="3">Often</option>
      </select>

      <label>2. How well have you been sleeping?</label>
      <select id="q2">
        <option value="0">Very well</option>
        <option value="1">Okay</option>
        <option value="2">Poorly</option>
        <option value="3">Very poorly</option>
      </select>

      <label>3. How connected do you feel to others around you?</label>
      <select id="q3">
        <option value="0">Very connected</option>
        <option value="1">Somewhat connected</option>
        <option value="2">A little isolated</option>
        <option value="3">Very isolated</option>
      </select>

      <br>
      <button onclick="calculatePremiumAssessment()" style="width:100%;">
        🔍 Get My Result
      </button>

      <div id="result" style="margin-top:24px;"></div>
      <div id="recommendation"></div>

    </div>
  </main>

  <footer>
    <p>© 2025 MindCare AI Premium</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | MindCare AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg"></div>

  <div id="loader">
    <div class="loader-text">🧠 MindCare AI</div>
  </div>

  <nav class="navbar">
    <div class="logo">🧠 MindCare AI</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="sign in.html">Login</a></li>
    </ul>
  </nav>

  <div class="form-container glass">
    <h2>Create Account 🌱</h2>
    <p style="color:var(--subtext); margin-bottom:20px;">Start your mental wellness journey today.</p>

    <form id="signupForm">
      <label>Full Name</label>
      <input type="text" placeholder="Your name" required>

      <label>Email</label>
      <input type="email" placeholder="you@email.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Create a password" required>

      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat your password" required>

      <br>
      <button type="submit" style="width:100%;">Create Account</button>
    </form>

    <p style="margin-top:20px; color:var(--subtext); text-align:center;">
      Already have an account? <a href="sign in.html" style="color:var(--secondary);">Login</a>
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

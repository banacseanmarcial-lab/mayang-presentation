<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat | MindCare AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg"></div>

  <div id="loader">
    <div class="loader-text">🧠 MindCare AI</div>
  </div>

  <nav class="navbar">
    <div class="logo">🧠 MindCare AI</div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="emotion-feed.html">Emotion Feed</a></li>
      <li><a href="voice.html">🎙️ Voice AI</a></li>
      <li><a href="ai-chat.html">AI Chat</a></li>
      <li><a href="journal.html">Journal</a></li>
      <li><a href="assessment.html">Assessment</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li>
        <button onclick="toggleDarkMode()" style="padding:8px 16px; font-size:0.85rem;">
          🌙 Dark Mode
        </button>
      </li>
    </ul>
  </nav>

  <main>
    <div class="chat-container glass">
      <h2>🤖 MindCare AI Chat</h2>
      <p style="color:var(--subtext); margin-bottom:20px;">
        Talk to your AI wellness companion. Share anything on your mind.
      </p>

      <div id="messages">
        <p><strong>MindCare AI:</strong> Hello! I'm here to support you. How are you feeling today? 💙</p>
      </div>

      <div class="chat-input-row" style="margin-top:16px;">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
        >
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
  <script src="subscription.js"></script>
  <script>MindCareSub.guard();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MindCare AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div id="bg"></div>
 
  <div id="loader">
    <div class="loader-text">🧠 MindCare AI</div>
  </div>
 
  <nav class="navbar">
    <div class="logo">🧠 MindCare AI</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="signup.html">Sign Up</a></li>
    </ul>
  </nav>
 
  <div class="form-container glass">
    <h2>Welcome Back 👋</h2>
    <p style="color:var(--subtext); margin-bottom:20px;">Sign in to continue your wellness journey.</p>
 
    <form id="loginForm">
      <label>Email</label>
      <input type="email" placeholder="you@email.com" required>
 
      <label>Password</label>
      <input type="password" placeholder="••••••••" required>
 
      <br>
      <button type="submit" style="width:100%;">Login</button>
    </form>
 
    <p style="margin-top:20px; color:var(--subtext); text-align:center;">
      Don't have an account? <a href="signup.html" style="color:var(--secondary);">Sign up</a>
    </p>
  </div>
 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
  <script src="subscription.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | MindCare AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg"></div>

  <div id="loader">
    <div class="loader-text">🧠 MindCare AI</div>
  </div>

  <div class="ai-orb" onclick="window.location.href='ai-chat.html'" title="Open AI Chat"></div>

  <nav class="navbar">
    <div class="logo">🧠 MindCare AI</div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="emotion-feed.html">Emotion Feed</a></li>
      <li><a href="voice.html">🎙️ Voice AI</a></li>
      <li><a href="ai-chat.html">AI Chat</a></li>
      <li><a href="journal.html">Journal</a></li>
      <li><a href="assessment.html">Assessment</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li>
        <button onclick="toggleDarkMode()" style="padding:8px 16px; font-size:0.85rem;">
          🌙 Dark Mode
        </button>
      </li>
    </ul>
  </nav>

  <main>
    <div class="form-container glass">

      <div style="text-align:center; margin-bottom:30px;">
        <div style="
          width:90px; height:90px; border-radius:50%;
          background:linear-gradient(135deg,var(--primary),var(--secondary));
          display:flex; align-items:center; justify-content:center;
          font-size:2.5rem; margin:0 auto 12px;
        ">🧠</div>
        <h2>My Profile</h2>
        <p style="color:var(--subtext);">Manage your personal information</p>
      </div>

      <label>Full Name</label>
      <input type="text" id="profileName" placeholder="Your name">

      <label>Age</label>
      <input type="number" id="profileAge" placeholder="Your age" min="1" max="120">

      <label>Gender</label>
      <select id="profileGender">
        <option value="">Prefer not to say</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="nonbinary">Non-binary</option>
        <option value="other">Other</option>
      </select>

      <br>
      <button onclick="saveProfile()" style="width:100%;">💾 Save Profile</button>

      <hr style="border-color:var(--border); margin:30px 0;">

      <div style="text-align:center;">
        <a href="logout.html" class="btn" style="
          background:rgba(239,68,68,.15);
          border:1px solid rgba(239,68,68,.3);
          color:#f87171;
        ">
          🚪 Logout
        </a>
      </div>

    </div>
  </main>

  <footer>
    <p>© 2025 MindCare AI Premium</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
  <script src="subscription.js"></script>
</body>
</html>

<div class="form-container glass">

<h1>📔 Personal Journal</h1>

<p>
Record your thoughts and track your emotions.
</p>

<br>

<label>Select Mood</label>

<select id="mood">

<option>😊 Happy</option>
<option>😌 Calm</option>
<option>😔 Sad</option>
<option>😰 Anxious</option>
<option>😴 Tired</option>

</select>

<textarea
id="journalEntry"
rows="8"
placeholder="Write about your day, feelings, thoughts, or goals...">
</textarea>

<button onclick="saveJournal()">

Save Journal Entry

</button>

<br><br>

<div class="glass" style="padding:20px;">

<h2>Saved Entry</h2>

<div id="savedEntry">

No journal entry yet.

</div>

</div>

</div>

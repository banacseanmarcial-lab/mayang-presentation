<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal | MindCare AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="bg"></div>

  <div id="loader">
    <div class="loader-text">🧠 MindCare AI</div>
  </div>

  <div class="ai-orb" onclick="window.location.href='ai-chat.html'" title="Open AI Chat"></div>

  <nav class="navbar">
    <div class="logo">🧠 MindCare AI</div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="emotion-feed.html">Emotion Feed</a></li>
      <li><a href="voice.html">🎙️ Voice AI</a></li>
      <li><a href="ai-chat.html">AI Chat</a></li>
      <li><a href="journal.html">Journal</a></li>
      <li><a href="assessment.html">Assessment</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li>
        <button onclick="toggleDarkMode()" style="padding:8px 16px; font-size:0.85rem;">
          🌙 Dark Mode
        </button>
      </li>
    </ul>
  </nav>

  <main>
    <div class="daily-checkin glass" style="margin-top:120px;">

      <h2>📔 My Journal</h2>
      <p style="color:var(--subtext); margin-bottom:24px;">
        Reflect on your day. Your entries are saved privately on this device.
      </p>

      <label>How are you feeling?</label>
      <select id="mood">
        <option value="😊 Happy">😊 Happy</option>
        <option value="😔 Sad">😔 Sad</option>
        <option value="😰 Stressed">😰 Stressed</option>
        <option value="🤔 Doubtful">🤔 Doubtful</option>
        <option value="😞 Guilty">😞 Guilty</option>
        <option value="😨 Fearful">😨 Fearful</option>
        <option value="😡 Angry">😡 Angry</option>
        <option value="🤩 Excited">🤩 Excited</option>
        <option value="🌧 Depressed">🌧 Depressed</option>
      </select>

      <label>Write your thoughts</label>
      <textarea
        id="journalEntry"
        rows="6"
        placeholder="What's on your mind today?..."
      ></textarea>

      <button onclick="saveJournal()" style="width:100%;">💾 Save Entry</button>

      <hr style="border-color:var(--border); margin:30px 0;">

      <h3 style="margin-bottom:12px;">📖 Past Entries</h3>
      <div id="savedEntry">
        <em style="color:var(--subtext);">No journal entries yet.</em>
      </div>

    </div>
  </main>

  <footer>
    <p>© 2025 MindCare AI Premium</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
  <script src="subscription.js"></script>
</body>
</html>
